name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: |
          node --check server.js
          node --check app.js
          node --check face_pad.js
          node --check test_server.js
          node --check attack_server.js
          node --check debug.js
          node --check debug_metrics.js
          node --check test_debug_metrics.js
      - name: Regression tests
        run: npm test
